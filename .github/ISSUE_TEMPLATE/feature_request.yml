name: Melhoria
description: Proponha uma funcionalidade, um jogo ou uma melhoria.
title: "[Melhoria]: "
labels:
  - enhancement
  - triagem
body:
  - type: checkboxes
    id: busca
    attributes:
      label: Antes de abrir
      options:
        - label: Procurei issues abertas e fechadas e não encontrei uma equivalente.
          required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Qual necessidade ou dificuldade motiva a proposta?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Descreva o comportamento desejado.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Quais outras soluções foram avaliadas e por que foram descartadas?
    validations:
      required: false
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Liste o que precisa estar pronto para considerar a proposta concluída.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área beneficiada
      options:
        - Hub de jogos
        - Linguagens
        - Matemática
        - Ciências da Natureza
        - Ciências Humanas
        - Progresso
        - Modo professor
        - Acessibilidade
        - Plataforma
        - Todas
    validations:
      required: true
  - type: dropdown
    id: publico
    attributes:
      label: Público beneficiado
      options:
        - Estudantes
        - Professores
        - Ambos
        - Não se aplica
    validations:
      required: true
  - type: dropdown
    id: disposicao
    attributes:
      label: Disposição para contribuir
      options:
        - Posso implementar a mudança
        - Posso ajudar nos testes
        - Apenas reporto a proposta
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Referências, esboços ou restrições, sem dados sensíveis.
    validations:
      required: false
  - type: checkboxes
    id: privacidade
    attributes:
      label: Privacidade
      options:
        - label: Confirmei que não incluí segredos nem dados reais de estudantes.
          required: true
