name: Bug
description: Reporte um comportamento incorreto.
title: "[Bug]: "
labels:
  - bug
  - triagem
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Não inclua dados reais de estudantes.
  - type: checkboxes
    id: busca
    attributes:
      label: Antes de abrir
      options:
        - label: Procurei issues abertas e fechadas e não encontrei uma equivalente.
          required: true
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Acesse ...
        2. Toque em ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: frequencia
    attributes:
      label: Frequência
      description: O problema acontece sempre ou de forma intermitente?
      options:
        - Sempre
        - Às vezes
        - Uma vez
        - Não sei
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      description: Quanto o problema atrapalha o uso?
      options:
        - Bloqueia o uso
        - Atrapalha o uso
        - Incômodo pequeno
        - Não sei
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - Hub de jogos
        - Jogo específico
        - Progresso
        - Modo professor
        - Acessibilidade
        - Navegação
        - Plataforma
        - Não se aplica
    validations:
      required: false
  - type: input
    id: jogo
    attributes:
      label: Jogo ou endereço
      description: Identificador do jogo ou endereço da tela, quando aplicável.
      placeholder: jogo/energia-em-transicao
    validations:
      required: false
  - type: dropdown
    id: publico
    attributes:
      label: Público afetado
      options:
        - Estudantes
        - Professores
        - Ambos
        - Não se aplica
    validations:
      required: false
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador, dispositivo e sistema operacional, sem dados sensíveis.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Capturas e logs relevantes, sem segredos nem dados reais.
      render: markdown
    validations:
      required: false
  - type: input
    id: relacao
    attributes:
      label: Issue relacionada
      description: Número de uma issue relacionada, quando houver.
      placeholder: "#123"
    validations:
      required: false
  - type: checkboxes
    id: privacidade
    attributes:
      label: Privacidade
      options:
        - label: Confirmei que não incluí segredos nem dados reais de estudantes.
          required: true
